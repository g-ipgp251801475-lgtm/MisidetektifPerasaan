<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🌲%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#193e2f"><title>Misi Detektif Perasaan: Waspada Selalu</title><link rel="stylesheet" href="style.css?v=c91f453d16ad"><script src="image-map.js?v=11fd7de0bcc0" defer></script><script src="audio-assets.js?v=15dcdb47d27b" defer></script><script src="audio.js?v=793cbf870734" defer></script><script src="script.js?v=e5e0d8afb070" defer></script></head>
<body>
<header class="topbar"><a href="#home" class="brand" aria-label="Laman utama"><span class="brand-icon">✦</span><span class="brand-lines"><span>MISI DETEKTIF PERASAAN</span><small>WASPADA SELALU</small></span></a><div class="top-actions"><span id="key-count" class="keys">🗝 0 / 2 kunci</span><button id="audio-toggle" class="icon-button" aria-expanded="false" aria-controls="audio-panel">♫ <span>Audio</span></button></div></header>
<aside id="audio-panel" hidden aria-label="Tetapan audio"><strong>Suasana pengembaraan</strong>
<div class="audio-channel"><label><input type="checkbox" id="music"> Muzik latar</label><label for="music-volume">Kelantangan muzik</label><input id="music-volume" type="range" min="0" max="100"></div>
<div class="audio-channel"><label><input type="checkbox" id="voice"> Suara panduan</label><label for="voice-volume">Kelantangan suara</label><input id="voice-volume" type="range" min="0" max="100"></div>
<div class="audio-channel"><label><input type="checkbox" id="effects"> Kesan bunyi</label><label for="effects-volume">Kelantangan kesan bunyi</label><input id="effects-volume" type="range" min="0" max="100"></div>
<small>Panduan suara menggunakan rakaman Bahasa Melayu. Jika rakaman belum disediakan, baca panduan pada skrin.</small></aside>
<p id="voice-status" class="voice-status" role="status" hidden></p>
<main id="app" tabindex="-1"></main>
<footer>BAHASA MELAYU TAHUN 4 <span>•</span> TEMA KESELAMATAN <span>•</span> Belajar, teroka & sentiasa berwaspada.</footer>

</body></html>
